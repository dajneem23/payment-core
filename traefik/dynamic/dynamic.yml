# Traefik dynamic configuration (file provider).
#
# Service-to-service calls (e.g. notification → user-service /internal/**)
# go directly over the compose network and are never routed through Traefik.
# Only the public-facing paths below are reachable from the host.

http:
  routers:
    # Explicitly block /internal — prevents accidental exposure if a broader
    # PathPrefix rule is added later. Returns 403, not 404, to make the intent
    # clear (this is a security boundary, not a missing page).
    deny-internal:
      rule: "PathPrefix(`/internal`)"
      entryPoints: [web]
      service: noop@internal
      priority: 999    # override any catch-all — routes to noop (502), not exposed

  # Core application routers
    # SPA catch-all — serves the VietPay web UI. Lowest priority so the more
    # specific PathPrefix rules below (auth, api, fx) win for API routes.
    web:
      rule: "PathPrefix(`/`)"
      entryPoints: [web]
      service: web

    # Public auth endpoints (login/register/refresh/verify) — NO forward-auth.
    auth:
      rule: "PathPrefix(`/auth`)"
      entryPoints: [web]
      service: auth

    # Notification API — public; used by other services to trigger emails.
    notifications:
      rule: "PathPrefix(`/notifications`)"
      entryPoints: [web]
      service: notifications

    # FX rates — public read-only market data (bid/ask vs VND).
    fx:
      rule: "PathPrefix(`/api/fx`)"
      entryPoints: [web]
      service: fx

    # Wallet API — protected: validate JWT via ForwardAuth, strip spoofed header.
    wallet:
      rule: "PathPrefix(`/api/v1`) || PathPrefix(`/actuator`)"
      entryPoints: [web]
      service: wallet
      middlewares: [strip-inbound-headers, forward-auth]

    # OpenAPI / Swagger UI — PUBLIC (API documentation), no ForwardAuth. Serves
    # the wallet-service springdoc UI + spec so `docker compose up` + a browser
    # can read the API without a token.
    docs:
      rule: "PathPrefix(`/swagger-ui`) || PathPrefix(`/v3/api-docs`)"
      entryPoints: [web]
      service: wallet

    # Payments API (card top-up) — protected like the wallet API. A user tops up
    # their OWN wallet, so the JWT identity (X-User-Id) is required. Acquirer
    # settlement webhooks reach the gateway east-west (direct container call),
    # NOT through this router, so they aren't subject to ForwardAuth.
    payments:
      rule: "PathPrefix(`/payments`)"
      entryPoints: [web]
      service: payments
      middlewares: [strip-inbound-headers, forward-auth]

    # Observability UIs (only up under `--profile observability`). Grafana is
    # configured to serve from the /grafana sub-path; Prometheus from /prometheus
    # (see its --web.route-prefix). Anonymous access in dev — no ForwardAuth.
    grafana:
      rule: "PathPrefix(`/grafana`)"
      entryPoints: [web]
      service: grafana
    prometheus:
      rule: "PathPrefix(`/prometheus`)"
      entryPoints: [web]
      service: prometheus

  services:
    # Dummy service referenced by the deny-internal router — never actually
    # called (the deny-403 middleware short-circuits before routing).
    noop:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:1"
    web:
      loadBalancer:
        servers:
          - url: "http://vietpay-web:80"
    auth:
      loadBalancer:
        servers:
          - url: "http://user-service:3004"
    notifications:
      loadBalancer:
        servers:
          - url: "http://notification-service:3003"
    fx:
      loadBalancer:
        servers:
          - url: "http://fx-service:3002"
    wallet:
      loadBalancer:
        servers:
          - url: "http://wallet-service:8080"
    payments:
      loadBalancer:
        servers:
          - url: "http://payment-gateway:3005"
    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"
    prometheus:
      loadBalancer:
        servers:
          - url: "http://prometheus:9090"

  middlewares:
    # Traefik calls user-service /auth/verify; on 200 it copies X-User-Id onto
    # the upstream request. On 401 the request is rejected before wallet-service.
    forward-auth:
      forwardAuth:
        address: "http://user-service:3004/auth/verify"
        authResponseHeaders:
          - X-User-Id
          - X-User-Role

    # Strip any client-supplied X-User-Id so a caller can't impersonate a user;
    # only the ForwardAuth response is allowed to set it.
    strip-inbound-headers:
      headers:
        customRequestHeaders:
          X-User-Id: ""
          X-User-Role: ""
