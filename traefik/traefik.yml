# Traefik static configuration — the north-south edge router.
#
# We use the FILE provider (not the Docker provider) for dynamic routing:
# OrbStack's daemon enforces a minimum Docker API version (1.40) and Traefik's
# Docker client negotiates at 1.24, so label discovery fails. The file provider
# sidesteps that entirely and needs no docker.sock mount (a security win).
# Routers/services/middlewares live in ./traefik/dynamic/*.yml.

entryPoints:
  web:
    address: ":80"

api:
  dashboard: true
  insecure: true          # dashboard on :8080 — dev convenience only

# Prometheus metrics — served on the internal `traefik` entrypoint (:8080),
# i.e. GET :8080/metrics. Per-router/service/entrypoint labels let Grafana
# break down request rate, latency, and status codes by route.
metrics:
  prometheus:
    addEntryPointsLabels: true
    addServicesLabels: true
    addRoutersLabels: true

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO

accessLog: {}
