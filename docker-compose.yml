# VietPay — full polyglot stack behind Traefik.
#
#   docker compose up                                  -> core (infra + services)
#   docker compose --profile observability up          -> + Prometheus + Grafana
#   docker compose --profile bi up                     -> + Superset (read-only)
#
# Java wallet-service owns the graded money core; the NestJS satellites handle
# fraud, FX, notifications and card acquiring. Traefik is the north-south edge;
# service-to-service calls go directly over this compose network by name.

name: vietpay

services:
  # ---------------------------------------------------------------- edge -----
  traefik:
    image: traefik:v3.5
    ports:
      - "80:80"       # public entry point
      - "8888:8080"   # dashboard (dev only)
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    restart: unless-stopped

  # ------------------------------------------------------------- datastores --
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vietpay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vietpay -d vietpay"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.1
    environment:
      # Single-node KRaft (no ZooKeeper). Official Apache image uses KAFKA_* vars.
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # -------------------------------------------------- Java core (graded) -----
  wallet-service:
    build: ./wallet-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/vietpay
      DB_USER: vietpay
      DB_PASSWORD: vietpay
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:9092
      FRAUD_URL: http://fraud-service:3001
      FX_URL: http://fx-service:3002
      OUTBOX_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    labels:
      - traefik.enable=true
      - traefik.http.routers.wallet.rule=PathPrefix(`/api/v1`) || PathPrefix(`/swagger-ui`) || PathPrefix(`/v3/api-docs`) || PathPrefix(`/actuator`)
      - traefik.http.routers.wallet.entrypoints=web
      # Protect the wallet API: ForwardAuth validates the JWT with user-service.
      - traefik.http.routers.wallet.middlewares=forward-auth@docker,strip-inbound-headers@docker
      - traefik.http.services.wallet.loadbalancer.server.port=8080
      # Middleware: strip any client-supplied X-User-Id so a caller can't
      # impersonate another user. Only the ForwardAuth response sets this header.
      - traefik.http.middlewares.strip-inbound-headers.headers.customrequestheaders.X-User-Id=
    restart: unless-stopped

  # ----------------------------------------------------- NestJS satellites ---
  user-service:
    build: ./user-service
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3004"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_DATABASE: vietpay_users
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "1"
      JWT_PRIVATE_KEY_PATH: /app/keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt-public.pem
      JWT_ACCESS_EXPIRES_IN: "900"
      JWT_REFRESH_EXPIRES_IN: "604800"
    volumes:
      # Mount the EC keypair read-only rather than baking the private key into
      # the image. In production this would be a secret / mounted vault path.
      - ./user-service/keys:/app/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    labels:
      - traefik.enable=true
      # Public auth endpoints (login/register/refresh) — NO forward-auth here.
      - traefik.http.routers.auth.rule=PathPrefix(`/auth`)
      - traefik.http.routers.auth.entrypoints=web
      - traefik.http.services.auth.loadbalancer.server.port=3004
      # ForwardAuth middleware definition (referenced by protected routers):
      # Traefik calls /auth/verify; on 200 it copies X-User-Id upstream.
      - traefik.http.middlewares.forward-auth.forwardauth.address=http://user-service:3004/auth/verify
      - traefik.http.middlewares.forward-auth.forwardauth.authResponseHeaders=X-User-Id
    restart: unless-stopped

  # fraud-service:
  #   build: ./services/fraud-service
  #   environment:
  #     PORT: "3001"
  #   labels:
  #     - traefik.enable=true
  #     - traefik.http.routers.fraud.rule=PathPrefix(`/fraud`)
  #     - traefik.http.routers.fraud.entrypoints=web
  #     - traefik.http.services.fraud.loadbalancer.server.port=3001
