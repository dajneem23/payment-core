  #   depends_on:
  #     kafka: { condition: service_healthy }
  #   restart: unless-stopped

  # payment-gateway:
  #   build: ./services/payment-gateway
  #   environment:
  #     PORT: "3000"
  #     WALLET_URL: http://wallet-service:8080
  #     VISA_URL: http://visa-service:3010
  #     MASTERCARD_URL: http://mastercard-service:3011
  #     GATEWAY_URL: http://payment-gateway:3000
  #   depends_on:
  #     - wallet-service
  #   labels:
  #     - traefik.enable=true
  #     - traefik.http.routers.payments.rule=PathPrefix(`/payments`)
  #     - traefik.http.routers.payments.entrypoints=web
  #     - traefik.http.services.payments.loadbalancer.server.port=3000
  #   restart: unless-stopped

  # visa-service:
  #   build: ./services/visa-service
  #   environment:
  #     PORT: "3010"
  #     SCHEME: VISA
  #     GATEWAY_WEBHOOK_URL: http://payment-gateway:3000/payments/webhooks/visa
  #   restart: unless-stopped

  # mastercard-service:
  #   build: ./services/mastercard-service
  #   environment:
  #     PORT: "3011"
  #     SCHEME: MASTERCARD
  #     GATEWAY_WEBHOOK_URL: http://payment-gateway:3000/payments/webhooks/mastercard
  #   restart: unless-stopped

  # ----------------------------------------- observability (opt-in profile) --
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.prometheus.rule=PathPrefix(`/prometheus`)
      - traefik.http.services.prometheus.loadbalancer.server.port=9090
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=PathPrefix(`/grafana`)
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    restart: unless-stopped

  # ------------------------------------------------- BI (opt-in profile) -----
  superset:
    image: apache/superset:4.0.2
    profiles: ["bi"]
    environment:
      SUPERSET_SECRET_KEY: vietpay-superset-dev-secret
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "8088:8088"
    restart: unless-stopped

  # ------------------------------------- centralized logging (opt-in) --------
  # EFK: services log structured JSON to stdout -> Filebeat ships container logs
  # -> Elasticsearch -> Kibana. Grafana answers "how much/how fast", Kibana
  # answers "what exactly happened on this transfer".
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.1
    profiles: ["logging"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.1
    profiles: ["logging"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch: { condition: service_healthy }
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.1
    profiles: ["logging"]
    user: root
    command: ["filebeat", "-e", "-strict.perms=false"]
    volumes:
      - ./observability/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      elasticsearch: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres_data:
  grafana_data:
  es_data:
