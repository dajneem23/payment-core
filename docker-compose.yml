# VietPay — full polyglot stack behind Traefik.
#
#   docker compose up                                  -> core (infra + services)
#   docker compose --profile observability up          -> + Prometheus + Grafana
#   docker compose --profile bi up                     -> + Superset (read-only)
#
# Java wallet-service owns the graded money core; the NestJS satellites handle
# fraud, FX, notifications and card acquiring. Traefik is the north-south edge;
# service-to-service calls go directly over this compose network by name.

name: vietpay

services:
  # ---------------------------------------------------------------- edge -----
  traefik:
    image: traefik:v3.5
    ports:
      - "80:80"       # public entry point
      - "8888:8080"   # dashboard (dev only)
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    restart: unless-stopped

  # ---------------------------------------------------------------- web -------
  vietpay-web:
    build: ./vietpay-web
    restart: unless-stopped

  # ------------------------------------------------------------- datastores --
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vietpay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vietpay -d vietpay"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.1
    environment:
      # Single-node KRaft (no ZooKeeper). Official Apache image uses KAFKA_* vars.
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # -------------------------------------------------- Java core (graded) -----
  wallet-service:
    build: ./wallet-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/vietpay
      DB_USER: vietpay
      DB_PASSWORD: vietpay
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:9092
      FX_URL: http://fx-service:3002
      OUTBOX_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    labels:
      - traefik.enable=true
      - traefik.http.routers.wallet.rule=PathPrefix(`/api/v1`) || PathPrefix(`/swagger-ui`) || PathPrefix(`/v3/api-docs`) || PathPrefix(`/actuator`)
      - traefik.http.routers.wallet.entrypoints=web
      # Protect the wallet API: ForwardAuth validates the JWT with user-service.
      - traefik.http.routers.wallet.middlewares=forward-auth@docker,strip-inbound-headers@docker
      - traefik.http.services.wallet.loadbalancer.server.port=8080
      # Middleware: strip any client-supplied X-User-Id so a caller can't
      # impersonate another user. Only the ForwardAuth response sets this header.
      - traefik.http.middlewares.strip-inbound-headers.headers.customrequestheaders.X-User-Id=
    restart: unless-stopped

  # ----------------------------------------------------- NestJS satellites ---
  user-service:
    build: ./user-service
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: "3004"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      DB_DATABASE: vietpay_users
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "1"
      JWT_PRIVATE_KEY_PATH: /app/keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt-public.pem
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: user-service
      KAFKA_USER_TOPIC: user-events
      OTEL_SERVICE_NAME: user-service
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318/v1/traces}"
      SEED_ADMIN: "${SEED_ADMIN:-true}"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@vietpay.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-internal-token}
      SWAGGER_ENABLED: "true"
    volumes:
      # Mount the EC keypair read-only rather than baking the private key into
      # the image. In production this would be a secret / mounted vault path.
      - ./user-service/keys:/app/keys:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    labels:
      - traefik.enable=true
      # Public auth endpoints (login/register/refresh) — NO forward-auth here.
      - traefik.http.routers.auth.rule=PathPrefix(`/auth`)
      - traefik.http.routers.auth.entrypoints=web
      - traefik.http.services.auth.loadbalancer.server.port=3004
      # ForwardAuth middleware definition (referenced by protected routers):
      # Traefik calls /auth/verify; on 200 it copies X-User-Id upstream.
      - traefik.http.middlewares.forward-auth.forwardauth.address=http://user-service:3004/auth/verify
      - traefik.http.middlewares.forward-auth.forwardauth.authResponseHeaders=X-User-Id
    restart: unless-stopped

  # fraud-service:
  #   build: ./services/fraud-service
  #   environment:
  #     PORT: "3001"
  #   labels:
  #     - traefik.enable=true
  #     - traefik.http.routers.fraud.rule=PathPrefix(`/fraud`)
  #     - traefik.http.routers.fraud.entrypoints=web
  #     - traefik.http.services.fraud.loadbalancer.server.port=3001
  #   restart: unless-stopped

  fx-service:
    build: ./fx-service
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: "3002"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      DB_DATABASE: vietpay_fx
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "2"
      FX_REFRESH_CRON: "${FX_REFRESH_CRON:-*/5 * * * *}"
      OTEL_SERVICE_NAME: fx-service
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318/v1/traces}"
      SWAGGER_ENABLED: "true"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  notification-service:
    build: ./notification-service
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: "3003"
      SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-false}"
      SMTP_USER: ${SMTP_USER:-resend}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: "${SMTP_FROM:-VietPay <noreply@example.com>}"
      SUPPORT_EMAIL: "${SUPPORT_EMAIL:-support@example.com}"
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: notification-service
      KAFKA_GROUP_ID: notification-service
      KAFKA_TRANSFER_TOPIC: transfer-events
      KAFKA_USER_TOPIC: user-events
      USER_SERVICE_URL: http://user-service:3004
      SERVICE_JWT_PRIVATE_KEY: /app/keys/service-auth-private.pem
      OTEL_SERVICE_NAME: notification-service
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318/v1/traces}"
      SWAGGER_ENABLED: "true"
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      kafka: { condition: service_healthy }
    labels:
      - traefik.enable=true
      - traefik.http.routers.notifications.rule=PathPrefix(`/notifications`)
      - traefik.http.routers.notifications.entrypoints=web
      - traefik.http.services.notifications.loadbalancer.server.port=3003
    restart: unless-stopped

  # -------------------------------------------- card payments (acquiring) ----
  # Gateway owns the /payments API + settlement-webhook receiver + its own DB
  # (vietpay_payments) and publishes PaymentCaptured to Kafka via a transactional
  # outbox. wallet-service consumes payment-events and posts the double-entry.
  payment-gateway:
    build: ./payment-gateway
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: "3005"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      DB_DATABASE: vietpay_payments
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: payment-gateway
      KAFKA_PAYMENT_TOPIC: payment-events
      VISA_URL: http://visa-service:3006
      MASTERCARD_URL: http://mastercard-service:3007
      ACQUIRER_API_KEY: ${ACQUIRER_API_KEY:-dev-acquirer-key}
      VISA_HMAC_SECRET: ${VISA_HMAC_SECRET:-visa-dev-secret}
      MASTERCARD_HMAC_SECRET: ${MASTERCARD_HMAC_SECRET:-mc-dev-secret}
      SELF_WEBHOOK_BASE_URL: http://payment-gateway:3005
      OUTBOX_ENABLED: "true"
      OTEL_SERVICE_NAME: payment-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318/v1/traces}"
      SWAGGER_ENABLED: "true"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    labels:
      # Routing lives in traefik/dynamic/dynamic.yml (file provider); labels are
      # documentation only. /payments is protected (forward-auth + strip).
      - traefik.enable=true
      - traefik.http.routers.payments.rule=PathPrefix(`/payments`)
      - traefik.http.routers.payments.entrypoints=web
      - traefik.http.services.payments.loadbalancer.server.port=3005
    restart: unless-stopped

  # Simulated acquirers — one shared codebase (acquirer-sim), two instances that
  # differ only by env (scheme, BIN allowlist, HMAC secret). No public ingress:
  # the gateway calls them east-west, and they webhook back over the network.
  visa-service:
    build: ./acquirer-sim
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: "3006"
      SCHEME: VISA
      ALLOWED_BINS: "${VISA_ALLOWED_BINS:-411111,424242,400000}"
      HMAC_SECRET: ${VISA_HMAC_SECRET:-visa-dev-secret}
      ACQUIRER_API_KEY: ${ACQUIRER_API_KEY:-dev-acquirer-key}
      SETTLEMENT_DELAY_MS: "${SETTLEMENT_DELAY_MS:-1500}"
      DECLINE_RATE: "${DECLINE_RATE:-0}"
      OTEL_SERVICE_NAME: visa-service
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318/v1/traces}"
    depends_on:
      - payment-gateway
    restart: unless-stopped

  mastercard-service:
    build: ./acquirer-sim
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: "3007"
      SCHEME: MASTERCARD
      ALLOWED_BINS: "${MASTERCARD_ALLOWED_BINS:-510510,555555,520000,222100}"
      HMAC_SECRET: ${MASTERCARD_HMAC_SECRET:-mc-dev-secret}
      ACQUIRER_API_KEY: ${ACQUIRER_API_KEY:-dev-acquirer-key}
      SETTLEMENT_DELAY_MS: "${SETTLEMENT_DELAY_MS:-1500}"
      DECLINE_RATE: "${DECLINE_RATE:-0}"
      OTEL_SERVICE_NAME: mastercard-service
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318/v1/traces}"
    depends_on:
      - payment-gateway
    restart: unless-stopped

  # ----------------------------------------- observability (opt-in profile) --
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # Serve under /prometheus so it works behind Traefik's PathPrefix(`/prometheus`)
    # router AND matches the Grafana datasource URL (http://prometheus:9090/prometheus).
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.route-prefix=/prometheus"
      - "--web.external-url=http://localhost/prometheus"
    labels:
      - traefik.enable=true
      - traefik.http.routers.prometheus.rule=PathPrefix(`/prometheus`)
      - traefik.http.services.prometheus.loadbalancer.server.port=9090
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=PathPrefix(`/grafana`)
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    restart: unless-stopped

  # ------------------------------------------------- BI (opt-in profile) -----
  superset:
    image: apache/superset:4.0.2
    profiles: ["bi"]
    environment:
      SUPERSET_SECRET_KEY: vietpay-superset-dev-secret
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "8088:8088"
    restart: unless-stopped

  # ------------------------------------- centralized logging (opt-in) --------
  # EFK: services log structured JSON to stdout -> Filebeat ships container logs
  # -> Elasticsearch -> Kibana. Grafana answers "how much/how fast", Kibana
  # answers "what exactly happened on this transfer".
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.1
    profiles: ["logging"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.1
    profiles: ["logging"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch: { condition: service_healthy }
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.1
    profiles: ["logging"]
    user: root
    command: ["filebeat", "-e", "-strict.perms=false"]
    volumes:
      - ./observability/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      elasticsearch: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres_data:
  grafana_data:
  es_data:

networks:
  default:
    name: vietpay
