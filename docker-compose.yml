# VietPay — full polyglot stack behind Traefik.
#
#   docker compose up                                  -> core (infra + services)
#   docker compose --profile observability up          -> + Prometheus + Grafana
#   docker compose --profile bi up                     -> + Superset (read-only)
#
# Java wallet-service owns the graded money core; the NestJS satellites handle
# fraud, FX, notifications and card acquiring. Traefik is the north-south edge;
# service-to-service calls go directly over this compose network by name.

name: vietpay

services:
  # ---------------------------------------------------------------- edge -----
  traefik:
    image: traefik:v3.1
    ports:
      - "80:80"       # public entry point
      - "8080:8080"   # dashboard (dev only)
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # ------------------------------------------------------------- datastores --
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vietpay
      POSTGRES_USER: vietpay
      POSTGRES_PASSWORD: vietpay
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vietpay -d vietpay"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.7
    environment:
      # Single-node KRaft (no ZooKeeper).
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # -------------------------------------------------- Java core (graded) -----
  wallet-service:
    build: ./wallet-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/vietpay
      DB_USER: vietpay
      DB_PASSWORD: vietpay
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:9092
      FRAUD_URL: http://fraud-service:3001
      FX_URL: http://fx-service:3002
      OUTBOX_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    labels:
      - traefik.enable=true
      - traefik.http.routers.wallet.rule=PathPrefix(`/api/v1`) || PathPrefix(`/swagger-ui`) || PathPrefix(`/v3/api-docs`) || PathPrefix(`/actuator`)
      - traefik.http.routers.wallet.entrypoints=web
      - traefik.http.services.wallet.loadbalancer.server.port=8080
    restart: unless-stopped

  # ----------------------------------------------------- NestJS satellites ---
  fraud-service:
    build: ./services/fraud-service
    environment:
      PORT: "3001"
    labels:
      - traefik.enable=true
      - traefik.http.routers.fraud.rule=PathPrefix(`/fraud`)
      - traefik.http.routers.fraud.entrypoints=web
      - traefik.http.services.fraud.loadbalancer.server.port=3001
    restart: unless-stopped

  fx-service:
    build: ./services/fx-service
    environment:
      PORT: "3002"
    labels:
      - traefik.enable=true
      - traefik.http.routers.fx.rule=PathPrefix(`/fx`)
      - traefik.http.routers.fx.entrypoints=web
      - traefik.http.services.fx.loadbalancer.server.port=3002
    restart: unless-stopped

  notification-service:
    build: ./services/notification-service
    environment:
      PORT: "3003"
      KAFKA_BROKER: kafka:9092
      TRANSFER_TOPIC: transfer-events
    depends_on:
      kafka: { condition: service_healthy }
    restart: unless-stopped

  payment-gateway:
    build: ./services/payment-gateway
    environment:
      PORT: "3000"
      WALLET_URL: http://wallet-service:8080
      VISA_URL: http://visa-service:3010
      MASTERCARD_URL: http://mastercard-service:3011
      GATEWAY_URL: http://payment-gateway:3000
    depends_on:
      - wallet-service
    labels:
      - traefik.enable=true
      - traefik.http.routers.payments.rule=PathPrefix(`/payments`)
      - traefik.http.routers.payments.entrypoints=web
      - traefik.http.services.payments.loadbalancer.server.port=3000
    restart: unless-stopped

  visa-service:
    build: ./services/visa-service
    environment:
      PORT: "3010"
      SCHEME: VISA
      GATEWAY_WEBHOOK_URL: http://payment-gateway:3000/payments/webhooks/visa
    restart: unless-stopped

  mastercard-service:
    build: ./services/mastercard-service
    environment:
      PORT: "3011"
      SCHEME: MASTERCARD
      GATEWAY_WEBHOOK_URL: http://payment-gateway:3000/payments/webhooks/mastercard
    restart: unless-stopped

  # ----------------------------------------- observability (opt-in profile) --
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.prometheus.rule=PathPrefix(`/prometheus`)
      - traefik.http.services.prometheus.loadbalancer.server.port=9090
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=PathPrefix(`/grafana`)
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    restart: unless-stopped

  # ------------------------------------------------- BI (opt-in profile) -----
  superset:
    image: apache/superset:4.0.2
    profiles: ["bi"]
    environment:
      SUPERSET_SECRET_KEY: vietpay-superset-dev-secret
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "8088:8088"
    restart: unless-stopped

  # ------------------------------------- centralized logging (opt-in) --------
  # EFK: services log structured JSON to stdout -> Filebeat ships container logs
  # -> Elasticsearch -> Kibana. Grafana answers "how much/how fast", Kibana
  # answers "what exactly happened on this transfer".
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.1
    profiles: ["logging"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.1
    profiles: ["logging"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch: { condition: service_healthy }
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.1
    profiles: ["logging"]
    user: root
    command: ["filebeat", "-e", "-strict.perms=false"]
    volumes:
      - ./observability/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      elasticsearch: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data:
  grafana_data:
  es_data:
