apiVersion: 1

# Loads dashboard JSON from a mounted folder on boot. Editable in the UI, but
# the files on disk are the source of truth (re-provisioned on restart).
providers:
  - name: vietpay
    orgId: 1
    folder: VietPay
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
