spring:
  application:
    name: wallet-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vietpay}
    username: ${DB_USER:vietpay}
    password: ${DB_PASSWORD:vietpay}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    hibernate:
      ddl-auto: validate          # migrations own the schema, never Hibernate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # outbox payloads are already JSON strings, so publish them verbatim
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      # consumes payment-events from the payment-gateway; payloads are JSON strings
      group-id: ${PAYMENTS_CONSUMER_GROUP:wallet-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8080

# ---- downstream services (east-west, direct by service name in compose) ----
app:
  fraud:
    base-url: ${FRAUD_URL:http://localhost:3001}
  fx:
    base-url: ${FX_URL:http://localhost:3002}
  outbox:
    enabled: ${OUTBOX_ENABLED:true}         # disabled in tests (no broker)
    topic: transfer-events
    poll-delay-ms: 1000
  payments:
    topic: ${PAYMENTS_TOPIC:payment-events}
    consumer:
      enabled: ${PAYMENTS_CONSUMER_ENABLED:true}   # disabled in tests (no broker)
      group: ${PAYMENTS_CONSUMER_GROUP:wallet-service}
      # Total delivery attempts before routing a failed record to payment-events.DLT.
      max-attempts: ${PAYMENTS_MAX_ATTEMPTS:3}
  fx-cache-ttl-seconds: 60

# ---- resilience4j: fraud check is an external dependency ----
resilience4j:
  circuitbreaker:
    instances:
      fraudCheck:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      fraudCheck:
        max-attempts: 3
        wait-duration: 200ms
  timelimiter:
    instances:
      fraudCheck:
        timeout-duration: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: wallet-service

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.vietpay.wallet: INFO
